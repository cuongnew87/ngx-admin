<nb-card>

  <nb-card-header>
    Tạo file YAML
  </nb-card-header>

  <nb-card-body>

    <!-- VERSION -->

    <div class="form-group">
      <label class="label">
        Chọn helm version
      </label>

      <nb-select
        fullWidth
        [(selected)]="selectedVersion"
        (selectedChange)="onVersionChange()">

        <nb-option
          *ngFor="let version of helmVersions"
          [value]="version">

          {{ version }}

        </nb-option>

      </nb-select>
    </div>

    <!-- FILE NAME -->

    <div class="form-group">
      <label class="label">
        Tên file yaml
      </label>

      <input
        nbInput
        fullWidth
        [(ngModel)]="fileName"
        name="fileName"
        placeholder="values.yaml">
    </div>

    <!-- RESOURCES -->

    <div
      *ngFor="let resource of templateSchema"
      class="resource-section">

      <nb-card size="small">

        <nb-card-header>
          {{ resource.resource }}
        </nb-card-header>

        <nb-card-body>

          <div
            *ngFor="let prop of resource.properties"
            class="form-group">

            <label class="label">
              {{ prop.label }}
            </label>

            <!-- STRING -->

            <input
              *ngIf="prop.type === 'string'"
              nbInput
              fullWidth
              status="primary"
              [(ngModel)]="formData[prop.name]"
              [name]="prop.name">

            <!-- NUMBER -->

            <input
              *ngIf="prop.type === 'number'"
              nbInput
              fullWidth
              type="number"
              status="info"
              [(ngModel)]="formData[prop.name]"
              [name]="prop.name">

            <!-- BOOLEAN -->

            <nb-toggle
              *ngIf="prop.type === 'boolean'"
              status="success"
              [(checked)]="formData[prop.name]">
            </nb-toggle>

          </div>

        </nb-card-body>

      </nb-card>

    </div>

    <!-- BUTTON -->

    <button
      nbButton
      status="success"
      size="large"
      fullWidth
      (click)="exportYaml()">

      Export YAML

    </button>

  </nb-card-body>

</nb-card>
