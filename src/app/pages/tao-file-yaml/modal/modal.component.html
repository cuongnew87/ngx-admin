<nb-card>

  <!-- HEADER -->

  <nb-card-header>
    Tạo file YAML
  </nb-card-header>

  <!-- BODY -->

  <nb-card-body>

    <!-- GLOBAL VERSION -->

    <div class="form-group">

      <label class="label" for="helmVersion">
        Chọn helm version
      </label>

      <nb-select
        fullWidth
        [(selected)]="selectedVersion"
        (selectedChange)="onVersionChange()">

        <nb-option
          *ngFor="let version of helmVersions"
          [value]="version">

          {{ version }}

        </nb-option>

      </nb-select>

    </div>

    <!-- TABSET -->

    <app-quick-generate
      *ngIf="showQuickGenerate"
      [templateSchema]="templateSchema"
      (generate)="generateMultipleFiles($event)">
    </app-quick-generate>

    <ngx-tab-files 
      [templateSchema]="templateSchema"
      [(yamlFiles)]="yamlFiles"
      [(selectedTabIndex)]="selectedTabIndex"
      (formChanged)="saveDraft()">
    </ngx-tab-files>

  </nb-card-body>

</nb-card>

<!-- ACTION -->

<div class="action-section">

  <button
    nbButton
    ghost
    status="info"
    type="button"
    (click)="showQuickGenerate = !showQuickGenerate">

    <nb-icon
      [icon]="showQuickGenerate
        ? 'chevron-up-outline'
        : 'flash-outline'">
    </nb-icon>

    {{ showQuickGenerate
        ? 'Ẩn tạo nhanh'
        : 'Gợi ý tạo file' }}

  </button>

  <button
    nbButton
    status="info"
    appearance="outline"
    (click)="addFile()">

    Thêm file

  </button>

  <button
    nbButton
    status="success"
    (click)="exportYaml()">

    Export YAML

  </button>

  <button
    nbButton
    status="danger"
    appearance="outline"
    type="button"
    nbTooltip="Xóa toàn bộ dữ liệu đã nhập"
    nbTooltipPlacement="top"
    (click)="resetForm()">

    <nb-icon icon="refresh-outline"></nb-icon>

    Reset

  </button>

</div>
