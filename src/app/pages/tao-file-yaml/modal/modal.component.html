<nb-card>

  <nb-card-header>
    Tạo file YAML
  </nb-card-header>

  <nb-card-body>

    <!-- VERSION -->

    <div class="form-group">
      <label class="label" for="helmVersion">
        Chọn helm version
      </label>

      <nb-select
        fullWidth
        [(selected)]="selectedVersion"
        (selectedChange)="onVersionChange()">

        <nb-option
          *ngFor="let version of helmVersions"
          [value]="version">

          {{ version }}

        </nb-option>

      </nb-select>
    </div>

    <!-- FILE NAME -->

    <div class="form-group">
      <label class="label" for="fileName">
        Tên file yaml
      </label>

      <input
        nbInput
        fullWidth
        [(ngModel)]="fileName"
        name="fileName"
        placeholder="values.yaml">
    </div>

    <div class="form-group">
      <label class="label" for="selectedResources">
        Chọn resource
      </label>

      <nb-select
        fullWidth
        multiple
        [(selected)]="selectedResources">

        <nb-option
          *ngFor="let resource of templateSchema"
          [value]="resource.resource">

          {{ resource.resource }}

        </nb-option>

      </nb-select>
    </div>

    <!-- RESOURCES -->

    <div
      *ngFor="let resource of templateSchema">

      <ng-container
        *ngIf="selectedResources.includes(resource.resource)">

        <nb-card class="resource-section">

          <nb-card-header>
            {{ resource.resource }}
          </nb-card-header>

          <nb-card-body>

            <div
              *ngFor="let prop of resource.properties"
              class="form-group">

              <label class="label" for="{{ prop.name }}">
                {{ prop.label }}
              </label>

              <!-- STRING -->

              <input
                *ngIf="prop.type === 'string'"
                nbInput
                fullWidth
                [(ngModel)]="formData[prop.name]"
                [name]="prop.name">

              <!-- NUMBER -->

              <input
                *ngIf="prop.type === 'number'"
                nbInput
                type="number"
                fullWidth
                [(ngModel)]="formData[prop.name]"
                [name]="prop.name">

              <!-- SELECT -->

              <nb-select
                *ngIf="prop.type === 'select'"
                fullWidth
                [(selected)]="formData[prop.name]">

                <nb-option
                  *ngFor="let option of prop.options"
                  [value]="option">

                  {{ option }}

                </nb-option>

              </nb-select>

              <!-- BOOLEAN -->

              <nb-toggle
                *ngIf="prop.type === 'boolean'"
                [(checked)]="formData[prop.name]">
              </nb-toggle>

            </div>

          </nb-card-body>

        </nb-card>

      </ng-container>

    </div>

    <!-- BUTTON -->

    <button
      nbButton
      status="success"
      size="large"
      fullWidth
      (click)="exportYaml()">

      Export YAML

    </button>

  </nb-card-body>

</nb-card>
