<nb-card>

  <nb-card-header>
    Reset dữ liệu
  </nb-card-header>

  <nb-card-body>

    Toàn bộ dữ liệu nhập dở sẽ bị xóa.
    Bạn có chắc muốn reset?

  </nb-card-body>

  <nb-card-footer class="dialog-actions">

    <button
      nbButton
      ghost
      status="basic"
      (click)="cancel()">

      Hủy

    </button>

    <button
      nbButton
      status="danger"
      (click)="confirm()">

      Reset

    </button>

  </nb-card-footer>

</nb-card>
