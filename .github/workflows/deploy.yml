name: Auto Deploy Angular to gh-pages

on:
  push:
    branches:
      - main # Kích hoạt khi push code vào main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Khuyên dùng Node 18 cho bản ngx-admin dùng builder cũ này để tránh lỗi build
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci --legacy-peer-deps

      - name: Build dự án Angular
        run: npx ng build --configuration=production --base-href /ngx-admin/

      - name: Tạo file 404.html để fix lỗi vào link trực tiếp
        # Sửa lại đường dẫn chính xác theo outputPath: "dist" trong file angular.json của bạn
        run: cp dist/index.html dist/404.html

      - name: Tự động push sang nhánh gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Sửa lại thành thư mục dist theo cấu hình dự án của bạn
          branch: gh-pages
          clean: true
